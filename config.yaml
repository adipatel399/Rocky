# ── ROCKY configuration ──────────────────────────────────────────────
# Edit and restart. Anything omitted falls back to sensible defaults.

title: "friend"       # how Rocky addresses you

voice:
  enabled: true
  name: "Rocko (English (US))"   # macOS `say` voice — instant + offline.
  rate: 180                       # words per minute. `say -v '?'` lists all.

# Voices shown in the HUD dropdown: [label, `say` voice name].
voice_options:
  - ["Rocko",            "Rocko (English (US))"]
  - ["Zarvox · alien",   "Zarvox"]
  - ["Trinoids · choir", "Trinoids"]
  - ["Cellos · musical", "Cellos"]
  - ["Organ",            "Organ"]
  - ["Boing",            "Boing"]
  - ["Fred · robotic",   "Fred"]
  - ["Daniel · British", "Daniel"]
  - ["Rishi · Indian",   "Rishi"]
  - ["Samantha · US",    "Samantha"]

port: 8765

ears:
  enabled: true
  wake_word: "rocky"      # say "Rocky" or "Hey Rocky" to wake him
  wake_engine: "whisper"  # "whisper" = spot the wake word with speech-to-text
                          # (works for any word); "openwakeword" = fast "Jarvis" model
  wake_threshold: 0.28    # (openwakeword only) tuned for "Jarvis" (0.2 = hair-trigger,
                          # 0.5 = must say "hey jarvis" clearly). While tuning,
                          # watch `curl localhost:8765/api/stats` → wake_peak.
  mic_gain: 1.5           # software mic boost; raise to 2–3 if he still misses you
  followup_seconds: 8     # conversation mode: after each reply he keeps
                          # listening this long — no wake word between turns
  silence_seconds: 0.8    # shorter pause before speech recognition starts
  max_command_seconds: 14
  whisper_model: "base.en"   # tiny.en = fastest · small.en = most accurate

acknowledgements:
  - "Yes, friend?"
  - "I here. Talk, friend."
  - "I listen, friend."
  - "Question, friend?"

sleep_phrases:
  ["go to sleep", "that's all", "thats all", "stand down", "dismissed",
   "sleep now", "goodbye rocky", "bye rocky", "thank you rocky", "good night rocky"]

brain:
  provider: "codex"        # ChatGPT account through Codex CLI; "claude" optional
  command: "codex"         # also auto-detects the bundled macOS app CLI
  transport: "app-server"  # persistent process + token streaming; "exec" fallback
  reasoning_effort: "low"  # quicker spoken answers; increase for harder tasks
  model: null              # null = Codex default; use a model your account supports
  cwd: null                # null = this Rocky project directory
  sandbox: "workspace-write" # read-only / workspace-write / danger-full-access
  permission_mode: "acceptEdits"
  # Legacy Claude-only options below (ignored by Codex).
  # This is what makes Rocky able to *act*. Trim it to restrict him.
  allowed_tools:
    ["Bash", "Read", "Glob", "Grep", "Write", "Edit",
     "WebSearch", "WebFetch", "TodoWrite", "Task"]
  timeout_seconds: 600
