<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROCKY</title>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/mermaid.min.js"></script>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/vendor/globe.gl.min.js"></script>
<style>
  :root {
    --bg: #060709;
    --bg2: #0d0f13;
    --gold: #ffb638;
    --gold-2: #ffd27a;
    --gold-glow: rgba(255, 182, 56, .5);
    --ice: #5fe6d4;
    --ice-dim: #2b8f88;
    --text: #ece7db;
    --dim: #8b8778;
    --line: rgba(255, 182, 56, .16);
    --line-cool: rgba(95, 230, 212, .18);
    --danger: #ff6b5b;
    --glass: rgba(11, 13, 17, .52);
    --glass-solid: #0c0e12;
    font-size: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 90% 80% at 50% 45%, rgba(20,14,8,.35), rgba(4,4,7,.9) 80%),
      url("/static/vendor/img/night-sky.png") center/cover no-repeat,
      var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: var(--ice-dim); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Petrova line (background phenomenon from the film) ---------- */
  #petrova { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .8; }

  /* ---------- globe (always-on centerpiece) ---------- */
  #globe-bg { position: fixed; inset: 0; z-index: 1; }
  #globe-canvas { position: absolute; inset: 0; }

  /* ---------- Rocky, floating & playable at the top-right of the globe ---------- */
  /* floats in the open space over the globe's upper-right, just left of the
     right dock (which is ~380px wide, pinned to the right edge). */
  #rocky-corner { position: fixed; right: 432px; top: 84px; width: 216px; height: 216px;
    z-index: 12; pointer-events: auto; cursor: grab;
    filter: drop-shadow(0 6px 22px rgba(0,0,0,.7)); touch-action: none; }
  #rocky-corner.dragging { cursor: grabbing; }
  #rocky-corner canvas { width: 100%; height: 100%; display: block; }
  #rocky-tag { position: fixed; right: 432px; top: 300px; width: 216px; text-align: center;
    z-index: 12; font-size: .52rem; letter-spacing: .34em; color: var(--gold-2); pointer-events: none;
    text-shadow: 0 0 10px var(--gold-glow); transition: opacity .3s; }
  /* on narrower screens the dock stacks away — tuck Rocky to the far corner */
  @media (max-width: 1320px) { #rocky-corner, #rocky-tag { right: 24px; } }
  @media (max-width: 1080px) { #rocky-corner, #rocky-tag { display: none; } }
  #globe-label {
    position: fixed; left: 366px; bottom: 118px; z-index: 6;
    font-size: .95rem; letter-spacing: .3em; color: var(--gold-2);
    text-shadow: 0 0 18px var(--gold-glow); pointer-events: none;
  }

  /* ---------- atmosphere overlays ---------- */
  #vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 90% 80% at 50% 46%, transparent 52%, rgba(3,4,6,.72) 100%); }
  #grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .04;
    background: repeating-linear-gradient(0deg, transparent 0 2px, #ffd27a 2px 3px); }

  /* ---------- header ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 12;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px;
    background: linear-gradient(180deg, rgba(6,7,9,.85), rgba(6,7,9,0));
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: .5em;
    color: var(--gold); text-shadow: 0 0 20px var(--gold-glow); }
  .brand .sub { font-size: .56rem; letter-spacing: .3em; color: var(--dim); }
  #chips { display: flex; gap: 22px; font-size: .62rem; letter-spacing: .18em; }
  #chips .chip .k { color: var(--dim); }
  #chips .chip .v { color: var(--ice); margin-left: 7px; }
  #chips .chip .v.off { color: var(--danger); }
  #voice-select { margin-left: 7px; background: rgba(255,255,255,.04);
    color: var(--gold-2); border: 1px solid rgba(212,175,110,.35); border-radius: 5px;
    font: inherit; letter-spacing: .12em; padding: 2px 6px; cursor: pointer;
    outline: none; text-transform: uppercase; }
  #voice-select:hover { border-color: var(--gold); }
  #voice-select option { background: #12100c; color: var(--ice); text-transform: none; }
  #dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--danger); margin-right: 6px; box-shadow: 0 0 8px currentColor; }
  #dot.on { background: var(--ice); }
  #clock { font-size: 1rem; letter-spacing: .16em; color: var(--gold-2);
    text-shadow: 0 0 12px var(--gold-glow); font-variant-numeric: tabular-nums; }

  /* ---------- glass docks ---------- */
  .dock {
    position: fixed; z-index: 10; top: 64px; bottom: 108px; width: 330px;
    background: var(--glass); backdrop-filter: blur(13px);
    border: 1px solid var(--line); display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,210,122,.06);
  }
  .dock::before, .dock::after {
    content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
    border: 1px solid var(--gold); opacity: .5;
  }
  .dock::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .dock::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  #dock-left { left: 20px; }
  #dock-right { right: 20px; width: 380px; }
  .dock-title { padding: 11px 16px; font-size: .6rem; letter-spacing: .3em;
    color: var(--dim); border-bottom: 1px solid var(--line);
    display: flex; gap: 6px; align-items: center; flex: none; }
  .dock-title .accent { color: var(--gold); }

  /* ---------- conversation ---------- */
  #feed { flex: 1; overflow-y: auto; padding: 15px 16px; display: flex;
    flex-direction: column; gap: 13px; }
  .msg { font-size: .76rem; line-height: 1.55; word-wrap: break-word; }
  .msg .who { letter-spacing: .16em; font-size: .58rem; display: block; margin-bottom: 3px; }
  .msg.user .who { color: var(--dim); }
  .msg.user .body { color: #fff8ec; }
  .msg.rocky .who { color: var(--gold); }
  .msg.rocky .body { color: var(--text); }
  .msg.rocky.live .body::after { content: "▋"; color: var(--gold);
    animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .msg.system { font-size: .64rem; color: var(--dim); font-style: italic; }
  .msg.activity { font-size: .64rem; color: var(--ice); opacity: .9; }
  .msg.activity::before { content: "▸ "; }

  /* ---------- intel panel (artifact) ---------- */
  .tab { cursor: pointer; padding: 3px 9px; border: 1px solid transparent; letter-spacing: .18em; }
  .tab.on { color: var(--gold); border-color: var(--line); text-shadow: 0 0 10px var(--gold-glow); }
  #artifact-name { margin-left: auto; color: var(--ice-dim); font-size: .58rem;
    max-width: 13ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane { flex: 1; overflow: auto; padding: 16px; display: none; }
  .pane.on { display: block; }
  #pane-view .empty { color: var(--dim); font-size: .66rem; letter-spacing: .12em;
    text-align: center; margin-top: 45%; line-height: 2.1; }
  #pane-view img { max-width: 100%; border: 1px solid var(--line); }
  .md-body { font-size: .8rem; line-height: 1.65; }
  .md-body h1, .md-body h2, .md-body h3 { color: var(--gold); margin: 1em 0 .45em;
    letter-spacing: .08em; font-weight: 600; }
  .md-body h1 { font-size: 1.05rem; } .md-body h2 { font-size: .92rem; }
  .md-body p, .md-body ul, .md-body ol { margin-bottom: .7em; }
  .md-body ul, .md-body ol { padding-left: 1.3em; }
  .md-body code { color: var(--ice); background: rgba(95,230,212,.08); padding: 1px 4px; }
  .md-body pre { background: rgba(0,0,0,.4); border: 1px solid var(--line);
    padding: 10px; overflow-x: auto; margin-bottom: .7em; }
  .md-body pre code { background: none; color: var(--text); }
  .md-body table { border-collapse: collapse; margin-bottom: .7em; width: 100%; }
  .md-body th, .md-body td { border: 1px solid var(--line); padding: 5px 9px;
    font-size: .74rem; text-align: left; }
  .md-body th { color: var(--gold); }
  .md-body a { color: var(--ice); }
  .mermaid-box { display: flex; justify-content: center; }
  .mermaid-box svg { max-width: 100%; height: auto; }
  #pane-board.on { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
  .thumb { border: 1px solid var(--line); cursor: pointer; position: relative; background: var(--glass-solid); }
  .thumb:hover { border-color: var(--gold); }
  .thumb img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
  .thumb .num { position: absolute; top: 4px; left: 4px; background: rgba(6,7,9,.85);
    color: var(--gold); font-size: .58rem; padding: 2px 6px; border: 1px solid var(--line); }
  .note-item { padding: 9px 10px; border: 1px solid var(--line); margin-bottom: 8px;
    cursor: pointer; font-size: .72rem; color: var(--text); }
  .note-item:hover { border-color: var(--gold); color: var(--gold); }
  .pane-hint { color: var(--dim); font-size: .64rem; letter-spacing: .1em;
    line-height: 1.9; text-align: center; margin-top: 40%; }

  /* ---------- geo card (overlays right dock) ---------- */
  #geo-card {
    position: fixed; z-index: 20; top: 64px; right: 20px; width: 380px;
    max-height: calc(100% - 172px); overflow-y: auto;
    background: linear-gradient(180deg, rgba(14,12,9,.9), rgba(8,9,12,.9));
    border: 1px solid var(--gold); backdrop-filter: blur(14px);
    padding: 22px 20px 20px; opacity: 0; transform: translateX(24px);
    transition: opacity .45s ease, transform .45s ease; pointer-events: none;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(255,182,56,.1);
  }
  #geo-card.on { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .card-close { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px;
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    cursor: pointer; font-size: .72rem; }
  .card-close:hover { color: var(--danger); border-color: var(--danger); }
  .card-eyebrow { font-size: .56rem; letter-spacing: .3em; color: var(--gold); }
  .card-place { font-size: 1.05rem; letter-spacing: .05em; color: #fff8ec;
    margin: 6px 0 16px; line-height: 1.3; }
  .wx-main { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .wx-emoji { font-size: 3rem; line-height: 1; filter: drop-shadow(0 0 12px rgba(95,230,212,.4)); }
  .wx-temp { font-size: 3rem; font-weight: 300; color: var(--gold-2); line-height: 1;
    text-shadow: 0 0 24px var(--gold-glow); }
  .wx-desc { font-size: .74rem; letter-spacing: .06em; color: var(--dim); margin-top: 4px; }
  .wx-sub { font-size: .68rem; color: var(--gold-2); margin-top: 4px; letter-spacing: .04em; }
  .wx-section { font-size: .54rem; letter-spacing: .3em; color: var(--gold); margin: 16px 0 9px; }
  .forecast { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; }
  .fc-day { flex: 1 0 auto; min-width: 42px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; padding: 8px 4px; border: 1px solid var(--line);
    background: rgba(255,182,56,.03); }
  .fc-name { font-size: .56rem; letter-spacing: .08em; color: var(--dim); }
  .fc-emoji { font-size: 1.1rem; }
  .fc-pop { font-size: .5rem; color: var(--ice); }
  .fc-hi { font-size: .78rem; color: var(--text); }
  .fc-lo { font-size: .68rem; color: var(--dim); }
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--line); border: 1px solid var(--line); }
  .kv-cell { background: rgba(8,9,12,.7); padding: 9px 11px; display: flex;
    flex-direction: column; gap: 3px; }
  .kv-k { font-size: .52rem; letter-spacing: .2em; color: var(--dim); }
  .kv-v { font-size: .92rem; color: var(--ice); }
  .news-list { display: flex; flex-direction: column; }
  .news-item { display: block; padding: 11px 0; border-top: 1px solid var(--line); text-decoration: none; }
  .news-item:first-child { border-top: none; }
  .news-item.lead .news-title { color: #fff8ec; font-size: .86rem; }
  .news-title { font-size: .76rem; line-height: 1.45; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .news-item:hover .news-title { color: var(--gold-2); }
  .news-meta { display: flex; gap: 8px; margin-top: 5px; align-items: center; }
  .news-src { font-size: .56rem; letter-spacing: .08em; color: var(--ice);
    border: 1px solid var(--line-cool); padding: 1px 6px; }
  .news-time { font-size: .56rem; color: var(--dim); }
  .news-watch { display: block; margin-top: 14px; text-align: center; padding: 9px;
    border: 1px solid var(--gold); color: var(--gold); font-size: .6rem;
    letter-spacing: .18em; text-decoration: none; }
  .news-watch:hover { background: rgba(255,182,56,.1); text-shadow: 0 0 10px var(--gold-glow); }

  /* pin */
  .globe-pin { position: relative; transform: translate(-50%, -50%); pointer-events: none; }
  .pin-core { position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 12px var(--gold); transform: translate(-50%, -50%); }
  .pin-ping { position: absolute; width: 8px; height: 8px; border-radius: 50%;
    border: 1px solid var(--gold); transform: translate(-50%, -50%); animation: ping 1.6s ease-out infinite; }
  @keyframes ping { 0% { width: 8px; height: 8px; opacity: .9; } 100% { width: 54px; height: 54px; opacity: 0; } }
  .pin-label { position: absolute; left: 12px; top: -8px; white-space: nowrap;
    font-size: .62rem; letter-spacing: .16em; color: var(--gold-2);
    text-shadow: 0 0 10px var(--gold-glow); }

  /* ---------- bottom console ---------- */
  #console { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 14; width: min(760px, 70vw); display: flex; flex-direction: column;
    align-items: center; gap: 9px; }
  #status-line { display: flex; gap: 14px; align-items: center; font-size: .64rem;
    letter-spacing: .3em; }
  #status { color: var(--gold-2); text-shadow: 0 0 14px var(--gold-glow); }
  #substatus { color: var(--dim); letter-spacing: .16em; max-width: 46ch;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #bar { width: 100%; display: flex; gap: 8px; align-items: center;
    background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(13px);
    padding: 7px 10px 7px 8px; }
  #reactor { width: 46px; height: 46px; flex: none; }
  #inputwrap { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  #inputwrap .prompt { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
  #cmd { flex: 1; background: none; border: none; outline: none; color: #fff8ec;
    font: inherit; font-size: .82rem; }
  #cmd::placeholder { color: var(--dim); letter-spacing: .08em; }
  .btn { border: 1px solid var(--line); background: transparent; color: var(--dim);
    font: inherit; font-size: .58rem; letter-spacing: .16em; padding: 10px 12px;
    cursor: pointer; white-space: nowrap; }
  .btn:hover { color: var(--gold); border-color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
  .btn.danger:hover { color: var(--danger); border-color: var(--danger); text-shadow: none; }

  /* ---------- window manager ---------- */
  #wm-layer { position: fixed; inset: 0; z-index: 22; pointer-events: none; }
  #wm-dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: 92px;
    z-index: 23; display: flex; gap: 8px; }
  .dock-chip { pointer-events: auto; background: var(--glass); border: 1px solid var(--gold);
    color: var(--gold-2); font: inherit; font-size: .6rem; letter-spacing: .1em;
    padding: 6px 10px; cursor: pointer; backdrop-filter: blur(10px); }
  .dock-chip:hover { background: rgba(255,182,56,.12); }

  .win {
    position: fixed; width: 372px; height: 440px; min-width: 260px; min-height: 200px;
    pointer-events: auto; display: flex; flex-direction: column; resize: both; overflow: hidden;
    background: linear-gradient(180deg, rgba(14,12,9,.94), rgba(8,9,12,.94));
    border: 1px solid var(--line); backdrop-filter: blur(16px);
    box-shadow: 0 24px 70px rgba(0,0,0,.66), 0 0 40px rgba(255,182,56,.08);
    opacity: 0; transform: scale(.96) translateY(8px); transition: opacity .2s, transform .2s;
  }
  .win.show { opacity: 1; transform: none; }
  .win.active { border-color: var(--gold); }
  .win.max { left: 20px !important; top: 60px !important; width: calc(100vw - 40px) !important;
    height: calc(100vh - 128px) !important; resize: none; }
  .win-bar { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); cursor: grab; flex: none;
    background: rgba(255,182,56,.05); }
  .win-title { font-size: .66rem; letter-spacing: .16em; color: var(--gold-2);
    display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; }
  .win-glyph { color: var(--gold); }
  .win-btns { display: flex; gap: 4px; flex: none; }
  .win-btn { width: 22px; height: 22px; background: transparent; border: 1px solid var(--line);
    color: var(--dim); cursor: pointer; font-size: .66rem; line-height: 1; }
  .win-btn:hover { color: var(--gold); border-color: var(--gold); }
  .win-btn.close:hover { color: var(--danger); border-color: var(--danger); }
  .win-body { flex: 1; overflow-y: auto; padding: 16px; }
  .win-raw { font-size: .68rem; color: var(--dim); white-space: pre-wrap; }
  .win-video { position: relative; width: 100%; padding-top: 56.25%; margin-bottom: 14px;
    border: 1px solid var(--line); background: #000; }
  .win-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wiki-hero { width: 100%; height: 170px; background-size: cover; background-position: center;
    border: 1px solid var(--line); margin-bottom: 14px; }
  .wiki-extract { font-size: .8rem; line-height: 1.6; color: var(--text); margin-bottom: 14px; }
  .win-link, .news-watch { display: inline-block; padding: 8px 12px; border: 1px solid var(--gold);
    color: var(--gold); font-size: .6rem; letter-spacing: .16em; text-decoration: none; }
  .win-link:hover { background: rgba(255,182,56,.1); }

  @media (max-width: 1180px) { #dock-right { display: none; } }
  @media (max-width: 820px) { #dock-left { display: none; } #chips { display: none; } #console { width: 90vw; } }
</style>

<svg id="petrova" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0c0"/><stop offset="35%" stop-color="#ff8a4a"/>
      <stop offset="100%" stop-color="rgba(255,79,163,0)"/>
    </radialGradient>
  </defs>
  <circle cx="80" cy="970" r="380" fill="url(#sunG)" opacity="0.45"/>
  <path d="M110,985 C150,560 150,430 320,300 C520,150 720,150 910,80" fill="none"
        stroke="#ff5fb0" stroke-width="11" filter="url(#pglow)" opacity="0.5"/>
  <path d="M110,985 C150,560 150,430 320,300 C520,150 720,150 910,80" fill="none"
        stroke="#ffc7e8" stroke-width="2.5" opacity="0.8"/>
  <g fill="#ff77c8" filter="url(#pglow)">
    <circle cx="150" cy="620" r="4"/><circle cx="205" cy="470" r="3"/><circle cx="300" cy="330" r="4"/>
    <circle cx="470" cy="215" r="3"/><circle cx="650" cy="165" r="4"/><circle cx="830" cy="115" r="3"/>
  </g>
</svg>
<div id="globe-bg"><div id="globe-canvas"></div></div>
<div id="globe-label"></div>
<div id="rocky-corner"><canvas id="rocky-corner-canvas"></canvas></div>
<div id="rocky-tag">ROCKY · ERIDIAN</div>
<div id="vignette"></div>
<div id="grain"></div>

<header>
  <div class="brand"><h1>ROCKY</h1><span class="sub">ERIDIAN · 40 ERIDANI</span></div>
  <div id="chips">
    <span class="chip"><span class="k">LINK</span><span class="v"><span id="dot"></span><span id="link-txt">OFFLINE</span></span></span>
    <span class="chip"><span class="k">EARS</span><span class="v off" id="t-ears">—</span></span>
    <span class="chip chip-voice"><span class="k">VOICE</span><select id="voice-select" title="Pick Rocky's voice"></select></span>
    <span class="chip"><span class="k">LOAD</span><span class="v" id="t-load">—</span></span>
  </div>
  <div id="clock">--:--:--</div>
</header>

<div id="dock-left" class="dock">
  <div class="dock-title"><span class="accent">◆</span> CONVERSATION</div>
  <div id="feed"></div>
</div>

<div id="dock-right" class="dock">
  <div class="dock-title">
    <span class="tab on" data-pane="view">VIEW</span>
    <span class="tab" data-pane="board">BOARD</span>
    <span class="tab" data-pane="notes">NOTES</span>
    <span id="artifact-name"></span>
  </div>
  <div class="pane on" id="pane-view">
    <div class="empty">◆<br>INTEL PANEL<br><span style="font-size:.58rem">markdown · diagrams · images appear here</span></div>
  </div>
  <div class="pane" id="pane-board"><div class="pane-hint">no thumbnails yet<br>“rocky, make me a thumbnail for…”</div></div>
  <div class="pane" id="pane-notes"><div class="pane-hint">no notes yet<br>“rocky, note down…”</div></div>
</div>

<div id="wm-layer"></div>
<div id="wm-dock"></div>

<div id="console">
  <div id="status-line"><span id="status">STANDING BY</span><span id="substatus">say “Rocky” — or just type</span></div>
  <div id="bar">
    <canvas id="reactor"></canvas>
    <div id="inputwrap"><span class="prompt">▸</span>
      <input id="cmd" autocomplete="off" spellcheck="false" placeholder="talk to rocky…"></div>
    <button class="btn" id="b-wake">WAKE</button>
    <button class="btn" id="b-mute">MUTE</button>
    <button class="btn" id="b-new">NEW</button>
    <button class="btn danger" id="b-stop">STOP</button>
  </div>
</div>

<script>
"use strict";
mermaid.initialize({ startOnLoad: false, theme: "dark", darkMode: true,
  themeVariables: { background: "#0c0e12", primaryColor: "#12141a",
    primaryTextColor: "#ece7db", primaryBorderColor: "#ffb638",
    lineColor: "#5fe6d4", fontFamily: "ui-monospace, Menlo, monospace" } });

/* ================= WebSocket ================= */
let ws = null, wsOk = false, muted = false;
const S = { state: "idle", level: 0 };
let liveMsg = null;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { wsOk = true; linkUI(); };
  ws.onclose = () => { wsOk = false; linkUI(); setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    switch (m.type) {
      case "init":
        setState(m.state); earsUI(m.ears);
        buildVoiceMenu(m.voices, m.voice);
        feedEl.innerHTML = ""; liveMsg = null;
        (m.history || []).forEach(h => addMsg(h.role, h.text));
        break;
      case "voice":
        { const sel = document.getElementById("voice-select");
          if (sel && m.name) sel.value = m.name; }
        break;
      case "state": setState(m.state); break;
      case "level": S.level = m.value; RockyChar.setLevel(m.value); break;
      case "stream_start": liveMsg = addMsg("rocky", "", true); break;
      case "delta":
        if (!liveMsg) liveMsg = addMsg("rocky", "", true);
        liveMsg.body.textContent += m.text; feedEl.scrollTop = feedEl.scrollHeight; break;
      case "stream_end": if (liveMsg) liveMsg.el.classList.remove("live"); break;
      case "message":
        if (m.role === "rocky" && liveMsg) {
          liveMsg.body.textContent = m.text; liveMsg.el.classList.remove("live"); liveMsg = null;
        } else addMsg(m.role, m.text);
        break;
      case "activity": break;  // internal tool activity — kept off the screen
      case "globe": GlobeStage.show(m); break;
      case "window": WM.open(m); break;
      case "window_update": WM.update(m.id, m.patch); break;
      case "ui": WM.action(m.action); break;
      case "artifact": showArtifact(m); break;
      case "board": renderBoard(m.items); break;
      case "notes": renderNotes(m.items); break;
    }
  };
}
function send(o) { if (wsOk) ws.send(JSON.stringify(o)); }
function buildVoiceMenu(voices, current) {
  const sel = document.getElementById("voice-select");
  if (!sel) return;
  if (!sel.dataset.built && voices && voices.length) {
    sel.innerHTML = "";
    voices.forEach(([label, name]) => {
      const o = document.createElement("option");
      o.value = name; o.textContent = label;
      sel.appendChild(o);
    });
    sel.dataset.built = "1";
    sel.addEventListener("change", () => send({ type: "set_voice", name: sel.value }));
  }
  if (current) sel.value = current;
}
function linkUI() {
  document.getElementById("dot").className = wsOk ? "on" : "";
  document.getElementById("link-txt").textContent = wsOk ? "SECURE" : "OFFLINE";
}
function earsUI(on) {
  const el = document.getElementById("t-ears");
  el.textContent = on ? "ONLINE" : "OFFLINE"; el.className = "v" + (on ? "" : " off");
}
connect();

/* ================= status ================= */
const STATUS = { idle: "STANDING BY", listening: "LISTENING", thinking: "THINKING", speaking: "TALKING" };
const HINTS = { idle: "say “Rocky” — or just type", listening: "talk, friend — Rocky listen", thinking: "Rocky work…", speaking: "" };
function setState(s) { S.state = s; RockyChar.setState(s); document.getElementById("status").textContent = STATUS[s] || s.toUpperCase(); sub(HINTS[s] ?? ""); }
function sub(t) { document.getElementById("substatus").textContent = t; }

/* ================= conversation ================= */
const feedEl = document.getElementById("feed");
function addMsg(role, text, live = false) {
  const div = document.createElement("div");
  div.className = "msg " + role + (live ? " live" : "");
  let body = div;
  if (role === "user" || role === "rocky") {
    const who = document.createElement("span"); who.className = "who";
    who.textContent = role === "user" ? "YOU ›" : "ROCKY ›";
    body = document.createElement("span"); body.className = "body"; body.textContent = text;
    div.append(who, body);
  } else div.textContent = text;
  feedEl.appendChild(div);
  while (feedEl.children.length > 120) feedEl.removeChild(feedEl.firstChild);
  feedEl.scrollTop = feedEl.scrollHeight;
  return { el: div, body };
}

/* ================= intel panel ================= */
const panes = { view: document.getElementById("pane-view"),
  board: document.getElementById("pane-board"), notes: document.getElementById("pane-notes") };
document.querySelectorAll(".tab").forEach(t => t.onclick = () => selectPane(t.dataset.pane));
function selectPane(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.pane === name));
  Object.entries(panes).forEach(([k, el]) => el.classList.toggle("on", k === name));
}
let mermaidSeq = 0;
async function showArtifact(m) {
  document.getElementById("artifact-name").textContent = m.name || "";
  const pane = panes.view; pane.innerHTML = "";
  if (m.kind === "image") {
    const img = document.createElement("img"); img.src = m.url + "?t=" + Date.now(); pane.appendChild(img);
  } else if (m.kind === "mermaid") {
    const box = document.createElement("div"); box.className = "mermaid-box"; pane.appendChild(box);
    try { const { svg } = await mermaid.render("mmd" + (++mermaidSeq), m.content); box.innerHTML = svg; }
    catch (err) { box.textContent = "diagram error: " + err.message; }
  } else {
    const body = document.createElement("div"); body.className = "md-body";
    body.innerHTML = marked.parse(m.content || ""); pane.appendChild(body);
    for (const pre of body.querySelectorAll("pre code.language-mermaid")) {
      const box = document.createElement("div"); box.className = "mermaid-box";
      try { const { svg } = await mermaid.render("mmd" + (++mermaidSeq), pre.textContent);
        box.innerHTML = svg; pre.parentElement.replaceWith(box); } catch {}
    }
  }
  selectPane("view");
}
function renderBoard(items) {
  const pane = panes.board; pane.innerHTML = "";
  if (!items || !items.length) { pane.innerHTML = '<div class="pane-hint">no thumbnails yet<br>“rocky, make me a thumbnail for…”</div>'; return; }
  for (const it of items) {
    const d = document.createElement("div"); d.className = "thumb";
    const num = (it.name.match(/^(\d+)/) || [])[1];
    d.innerHTML = `<img src="${it.url}?t=${Date.now()}" loading="lazy">` + (num ? `<span class="num">#${num}</span>` : "");
    d.title = it.name; d.onclick = () => showArtifact({ name: it.name, kind: "image", url: it.url });
    pane.appendChild(d);
  }
}
function renderNotes(items) {
  const pane = panes.notes; pane.innerHTML = "";
  if (!items || !items.length) { pane.innerHTML = '<div class="pane-hint">no notes yet<br>“rocky, note down…”</div>'; return; }
  for (const it of items) {
    const d = document.createElement("div"); d.className = "note-item"; d.textContent = "▤ " + it.name;
    d.onclick = () => send({ type: "open_note", name: it.name }); pane.appendChild(d);
  }
}

/* ================= console controls ================= */
const cmd = document.getElementById("cmd");
cmd.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && cmd.value.trim()) { send({ type: "command", text: cmd.value.trim() }); cmd.value = ""; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== cmd) { e.preventDefault(); cmd.focus(); }
  if (e.key === "Escape") {
    if (document.querySelector("#wm-layer .win.show")) WM.action("close");
    else send({ type: "interrupt" });
  }
});
document.getElementById("b-stop").onclick = () => send({ type: "interrupt" });
document.getElementById("b-wake").onclick = () => send({ type: "wake" });
document.getElementById("b-new").onclick = () => send({ type: "new_session" });
document.getElementById("b-mute").onclick = function () {
  muted = !muted; send({ type: "mute_ears", value: muted }); this.textContent = muted ? "UNMUTE" : "MUTE";
};

/* ================= clock + stats ================= */
setInterval(() => { document.getElementById("clock").textContent = new Date().toTimeString().slice(0, 8); }, 250);
async function pollStats() {
  try {
    const s = await (await fetch("/api/stats")).json();
    document.getElementById("t-load").textContent = s.load.toFixed(2);
    earsUI(s.ears);
  } catch {}
}
setInterval(pollStats, 4000); pollStats();

/* ================= Rocky character (centerpiece + mini voice core) ======= */
</script>

<script src="/static/rocky.js?b=9"></script>
<script src="/static/windows.js?b=4"></script>
<script src="/static/globe.js?b=6"></script>
<script>
  RockyChar.create(document.getElementById("rocky-corner-canvas"), { spin: true, interactive: true });
  RockyChar.create(document.getElementById("reactor"), { mini: true });
  GlobeStage.init();
</script>
